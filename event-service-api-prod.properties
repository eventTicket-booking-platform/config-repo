spring.application.name=event-service-api
server.port=9091
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://35.223.83.252:3306/ec7205_event_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${EVENT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.jdbc.dialect=mysql
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

accessKey=${AWS_ACCESS_KEY_ID}
secret=${AWS_SECRET_ACCESS_KEY}
bucketName=ec7205-event-booking
region=us-east-1

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ec7205
