spring.application.name=auth-service-api
server.port=9092
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:mysql://35.223.83.252:3306/ec7205_eventHub_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.jdbc.dialect=mysql
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.resourceserver.jwt.token-uri=http://localhost:8080/realms/ec7205 /protocol/openid-connect/token
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ec7205
public.key.

keycloak.config.realm=ec7205
keycloak.config.server-url=http://localhost:8080/
keycloak.config.client-id=ec7205-client
keycloak.config.grant-type=password
keycloak.config.name=${KEYCLOAK_CONFIG_NAME}
keycloak.config.secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.config.password=${KEYCLOAK_CONFIG_PASSWORD}

accessKey=${AWS_ACCESS_KEY_ID}
secret=${AWS_SECRET_ACCESS_KEY}
bucketName=ec7205-event-booking
region=us-east-1

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
eventhub.notification.auth-queue=auth.notification.queue
