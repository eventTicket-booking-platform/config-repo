spring.application.name=event-service-api
server.port=9091

spring.datasource.url=jdbc:mysql://localhost:3306/ec7205_event_service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${EVENT_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.jdbc.dialect=mysql
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8080/realms/ec7205}

accessKey=${AWS_ACCESS_KEY_ID:}
secret=${AWS_SECRET_ACCESS_KEY:}
bucketName=my-files-amiru
aws.s3.banner-directory=ec7205-event-booking/banner
region=us-east-1
