spring.application.name=gateway-service-api
server.port=9090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.security.oauth2.resourceserver.jwt.token-uri=http://localhost:8080/realms/ec7205 /protocol/openid-connect/token
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ec7205
public.key.

keycloak.config.realm=ec7205
keycloak.config.server-url=http://localhost:8080/
keycloak.config.client-id=ec7205-client
keycloak.config.grant-type=password
keycloak.config.name=${KEYCLOAK_CONFIG_NAME}
keycloak.config.secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.config.password=${KEYCLOAK_CONFIG_PASSWORD}

gateway.routes.event-service-uri=http://event-service:9091
gateway.routes.auth-service-uri=http://auth-service:9092
gateway.routes.booking-service-uri=http://booking-service:9093
gateway.routes.notification-service-uri=http://notification-service:9094